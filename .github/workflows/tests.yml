name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: MPLBACKEND=Agg python -m pytest -q
      - name: Install and run the compact starter independently
        env:
          MPLBACKEND: Agg
        working-directory: ${{ runner.temp }}
        run: |
          python -m zipfile -e "$GITHUB_WORKSPACE/docs/downloads/csv-starter.zip" "$RUNNER_TEMP/csv-starter"
          python -m venv "$RUNNER_TEMP/starter-env"
          "$RUNNER_TEMP/starter-env/bin/python" -m pip install "$RUNNER_TEMP/csv-starter/multicopter-csv-starter"
          "$RUNNER_TEMP/starter-env/bin/python" "$RUNNER_TEMP/csv-starter/multicopter-csv-starter/examples/csv_starter.py"
      - name: Build wheel and install in a clean environment
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
      - name: Reproduce calibration with the installed wheel outside the checkout
        env:
          MPLBACKEND: Agg
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-env/bin/multicopter-range" calculate \
            --hover-power 1101.6581196581196 --battery-energy 1198.8 --mass 12.4 \
            --drag-area 450 --prop-diameter 29 --rotors 4 --correction-factor 0.6159319356120826
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/examples/analyze_aircraft.py"
          "$RUNNER_TEMP/wheel-env/bin/multicopter-range" analyze-calibration \
            --data-root "$GITHUB_WORKSPACE/data/calibration/2026-07-03"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/examples/reproduce_showcase.py" \
            --data-root "$GITHUB_WORKSPACE/data/calibration/2026-07-03" \
            --validation-root "$GITHUB_WORKSPACE/data/validation/2026-07-21" \
            --output-dir "$RUNNER_TEMP/showcase-output" \
            --check-results "$GITHUB_WORKSPACE/docs/results"
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/examples/analyze_mass_sensitivity.py" \
            --data-root "$GITHUB_WORKSPACE/data/calibration/2026-07-03" \
            --validation-root "$GITHUB_WORKSPACE/data/validation/2026-07-21" \
            --output-dir "$RUNNER_TEMP/mass-sensitivity-output" \
            --check-summary "$GITHUB_WORKSPACE/docs/results/mass-transfer-sensitivity.json"
